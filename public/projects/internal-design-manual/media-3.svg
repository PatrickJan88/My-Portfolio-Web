<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#121622" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>
    <radialGradient id="aura" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)" />
  <rect width="1200" height="900" fill="url(#aura)" />
  <rect x="50" y="50" width="1100" height="800" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <text x="90" y="110" font-family="monospace" font-size="12" fill="#a855f7" letter-spacing="2">MEDIA SLOT 03 • SECTION 2 (DESIGN STRATEGY)</text>
  <text x="1110" y="110" text-anchor="end" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.3)" letter-spacing="2">ASPECT 4:3</text>

  <g transform="translate(90, 200)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="38" font-weight="700" fill="#ffffff">Living Component Library &amp; Guidelines</text>
    <text y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="400" fill="#94a3b8">Interactive states, accessibility specs, and production code bridges</text>
  </g>

  <!-- Visual Card Graphic -->
  <g transform="translate(90, 310)">
    <rect width="1020" height="480" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <g transform="translate(40, 40)">
      <rect width="450" height="390" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" />
      <text x="24" y="40" font-family="sans-serif" font-size="16" font-weight="600" fill="#ffffff">Interactive State Matrix</text>
      <!-- Buttons in various states -->
      <rect x="24" y="70" width="180" height="42" rx="21" fill="#38bdf8" />
      <text x="114" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#000000">Default Primary</text>

      <rect x="230" y="70" width="180" height="42" rx="21" fill="#0ea5e9" stroke="#ffffff" stroke-width="2" />
      <text x="320" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Hover State</text>

      <rect x="24" y="130" width="180" height="42" rx="21" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" />
      <text x="114" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff">Ghost Pill</text>

      <rect x="230" y="130" width="180" height="42" rx="21" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="320" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#64748b">Disabled State</text>

      <!-- Code Inspector -->
      <rect x="24" y="200" width="400" height="160" rx="8" fill="#080a0f" stroke="rgba(255,255,255,0.08)" />
      <text x="44" y="235" font-family="monospace" font-size="12" fill="#64748b">&lt;!-- React / Tailwind Token --&gt;</text>
      <text x="44" y="265" font-family="monospace" font-size="12" fill="#38bdf8">&lt;Button variant="primary" size="md"&gt;</text>
      <text x="64" y="290" font-family="monospace" font-size="12" fill="#ffffff">Save Changes</text>
      <text x="44" y="315" font-family="monospace" font-size="12" fill="#38bdf8">&lt;/Button&gt;</text>
    </g>

    <g transform="translate(520, 40)">
      <rect width="460" height="390" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" />
      <text x="24" y="40" font-family="sans-serif" font-size="16" font-weight="600" fill="#ffffff">Accessibility &amp; Contrast Validation</text>
      
      <rect x="24" y="70" width="410" height="80" rx="10" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)" />
      <text x="44" y="105" font-family="monospace" font-size="13" font-weight="700" fill="#22c55e">✓ WCAG 2.1 AA PASS</text>
      <text x="44" y="130" font-family="sans-serif" font-size="12" fill="#cbd5e1">Contrast Ratio: 7.2:1 against cosmic dark background</text>

      <rect x="24" y="170" width="410" height="190" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" />
      <text x="44" y="210" font-family="sans-serif" font-size="14" font-weight="600" fill="#ffffff">Handoff Notes &amp; Dos / Don'ts</text>
      <text x="44" y="240" font-family="sans-serif" font-size="13" fill="#94a3b8">• Always nest inner radii: R_inner = R_outer - Padding</text>
      <text x="44" y="270" font-family="sans-serif" font-size="13" fill="#94a3b8">• Use text-pretty for body text to avoid orphaned words</text>
      <text x="44" y="300" font-family="sans-serif" font-size="13" fill="#94a3b8">• Respect user reduced-motion preferences globally</text>
    </g>
  </g>
</svg>
