      <text x="40" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="56" font-weight="700" fill="#38bdf8">-40%</text>
      <text x="40" y="130" font-family="sans-serif" font-size="18" font-weight="600" fill="#ffffff">Handoff Turnaround</text>
      <text x="40" y="170" font-family="sans-serif" font-size="14" fill="#94a3b8">Accelerated delivery cycle from design review to production merge across multi-functional teams.</text>
    </g>

