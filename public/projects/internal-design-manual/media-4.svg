      <stop offset="0%" stop-color="#090a0d" />
      <stop offset="50%" stop-color="#151322" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7523" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090a0d" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#aura)" />
  <rect x="60" y="60" width="1480" height="780" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

