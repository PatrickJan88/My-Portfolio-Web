      <text x="40" y="130" font-family="sans-serif" font-size="18" font-weight="600" fill="#ffffff">System Adoption</text>
      <text x="40" y="170" font-family="sans-serif" font-size="14" fill="#94a3b8">Active weekly usage across engineering, QA, design, and product management squads.</text>
