  <g transform="translate(100, 200)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="44" font-weight="700" fill="#ffffff">Organizational Adoption &amp; Shipping Velocity</text>
